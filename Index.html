<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Belajar</title>
    <link rel="stylesheet" href="style.css">

    <!-- Icon (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <h1 class="nama">Piyantoro</h1>
        <p class="subjudul">Catatan Belajar</p>

        <div class="menu">
            <button class="card" onclick="bukaMapel('pancasila')">
                <i class="fa-solid fa-scale-balanced"></i>
                <span>Pendidikan Pancasila</span>
            </button>

            <button class="card" onclick="bukaMapel('matematika')">
                <i class="fa-solid fa-calculator"></i>
                <span>Matematika</span>
            </button>
        </div>

        <!-- Konten -->
        <div id="konten" class="konten">
            <p>Pilih mata pelajaran untuk melihat catatan.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
